<!doctype html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sanharo | Administração</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8e8;color:#32100b}
header{background:#e51b23;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1000px;margin:auto;padding:20px}.panel{background:#fff;padding:18px;border-radius:18px;box-shadow:0 4px 18px #0002;margin-bottom:18px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0 12px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
.primary{background:#e51b23;color:#fff}.green{background:#25d366;color:#fff}.yellow{background:#ffd21c;color:#32100b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.product{border:1px solid #ddd;border-radius:14px;padding:12px;background:#fff}
.product img{width:100%;height:150px;object-fit:cover;border-radius:10px}.row{display:flex;gap:8px}.row>*{flex:1}
.hidden{display:none}.muted{color:#666;font-size:14px}.danger{background:#c62828;color:#fff}
</style></head><body>
<header><strong>SANHARO COXINHAS — ADMIN</strong><button class="yellow" onclick="logout()">Sair</button></header>
<main>
<section id="login" class="panel">
<h2>Entrar na administração</h2>
<p class="muted">Somente o administrador deve ter acesso.</p>
<input id="email" type="email" placeholder="E-mail">
<input id="password" type="password" placeholder="Senha">
<button class="primary" onclick="login()">ENTRAR</button>
<p id="loginMsg"></p>
</section>

<section id="admin" class="hidden">
<div class="panel">
<h2>Adicionar produto</h2>
<div class="row"><input id="pname" placeholder="Nome do produto"><input id="pprice" type="number" step="0.01" placeholder="Preço"></div>
<div class="row"><input id="pcat" placeholder="Categoria (ex.: Coxinhas)"><input id="pemoji" placeholder="Emoji, se não tiver foto"></div>
<label>Foto do produto</label><input id="pimage" type="file" accept="image/*">
<button class="green" onclick="addProduct()">ADICIONAR PRODUTO</button>
</div>
<div class="panel"><h2>Produtos</h2><div id="products" class="grid"></div></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL='https://gwyepuukycpiinpdwfeb.supabase.co/rest/v1/'; KEY="sb_publishable_DKjZo7vg8ohFeeTpicXUhA_eUxYvsoE";
const sb=supabase.createClient(URL,KEY);
let list=[];
function msg(t){document.getElementById("loginMsg").textContent=t}
async function login(){
 if(!sb)return msg("Configure o Supabase primeiro.");
 const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});
 if(error)return msg(error.message);
 show();
}
async function show(){
 if(!sb)return;
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return;
 document.getElementById("login").classList.add("hidden");
 document.getElementById("admin").classList.remove("hidden");
 load();
}
async function load(){
 const {data,error}=await sb.from("products").select("*").order("category").order("name");
 if(error)return alert(error.message);
 list=data||[]; render();
}
function render(){
 products.innerHTML=list.map(p=>`<article class="product">
 ${p.image_url?`<img src="${p.image_url}">`:"<div style='font-size:60px;text-align:center;padding:35px'>"+(p.emoji||"🍴")+"</div>"}
 <input value="${esc(p.name)}" onchange="edit('${p.id}','name',this.value)">
 <div class="row"><input type="number" step="0.01" value="${p.price}" onchange="edit('${p.id}','price',this.value)"><input value="${esc(p.category||"")}" onchange="edit('${p.id}','category',this.value)"></div>
 <label><input type="checkbox" ${p.active?"checked":""} onchange="edit('${p.id}','active',this.checked)"> Disponível</label>
 <input type="file" accept="image/*" onchange="changeImage('${p.id}',this.files[0])">
 <button class="danger" onclick="removeProduct('${p.id}')">EXCLUIR</button>
 </article>`).join("");
}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
async function edit(id,field,value){
 const v=field==="price"?Number(value):value;
 const {error}=await sb.from("products").update({[field]:v}).eq("id",id);
 if(error)alert(error.message);
}
async function addProduct(){
 const name=document.getElementById("pname").value.trim(), price=Number(document.getElementById("pprice").value);
 if(!name||!price)return alert("Informe nome e preço.");
 const file=document.getElementById("pimage").files[0]; let image_url="";
 if(file) image_url=await upload(file);
 const {error}=await sb.from("products").insert({name,price,category:pcat.value,emoji:pemoji.value,image_url,active:true});
 if(error)return alert(error.message);
 pname.value="";pprice.value="";pcat.value="";pemoji.value="";pimage.value="";load();
}
async function changeImage(id,file){
 if(!file)return; const url=await upload(file);
 const {error}=await sb.from("products").update({image_url:url}).eq("id",id);
 if(error)alert(error.message); else load();
}
async function upload(file){
 const ext=file.name.split(".").pop().toLowerCase(), path=crypto.randomUUID()+"."+ext;
 const {error}=await sb.storage.from("product-images").upload(path,file,{upsert:true});
 if(error){alert(error.message);return "";}
 const {data}=sb.storage.from("product-images").getPublicUrl(path);
 return data.publicUrl;
}
async function removeProduct(id){
 if(!confirm("Excluir este produto?"))return;
 const {error}=await sb.from("products").delete().eq("id",id);
 if(error)alert(error.message); else load();
}
async function logout(){if(sb)await sb.auth.signOut();location.reload()}
show();
</script></body></html>
