<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e30613">
  <link rel="manifest" href="manifest.json">
  <title>Sanharo Coxinhas | Delivery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🥟</div>
      <div><strong>SANHARO</strong><span>COXINHAS</span></div>
    </div>
    <button class="icon-btn" id="openCart" aria-label="Abrir carrinho">🛒<b id="cartCount">0</b></button>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">COXINHAS E PASTÉIS</p>
        <h1>O sabor que você <em>pede e ama!</em></h1>
        <button class="cta" onclick="document.getElementById('categories').scrollIntoView({behavior:'smooth'})">🛍️ FAZER PEDIDO</button>
      </div>
      <div class="hero-food">🥟<br>🍗</div>
    </section>

    <section id="categories" class="section">
      <h2>Escolha uma categoria</h2>
      <div class="chips">
        <button class="chip active" data-cat="Todos">Todos</button>
        <button class="chip" data-cat="Pastéis">🥟 Pastéis</button>
        <button class="chip" data-cat="Coxinhas">🍗 Coxinhas</button>
        <button class="chip" data-cat="Especiais">🔥 Especiais</button>
        <button class="chip" data-cat="Combos">🎉 Combos</button>
        <button class="chip" data-cat="Bebidas">🥤 Bebidas</button>
      </div>
    </section>

    <section class="products" id="products"></section>
  </main>

  <aside class="cart" id="cartPanel">
    <div class="cart-head"><h2>Meu pedido</h2><button id="closeCart">✕</button></div>
    <div id="cartItems"></div>
    <div class="cart-footer">
      <div class="row"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div>
      <div class="row"><span>Taxa de entrega</span><strong id="deliveryFee">A calcular</strong></div>
      <div class="total"><span>Total</span><strong id="total">R$ 0,00</strong></div>
      <button class="cta full" id="checkoutBtn">FINALIZAR PEDIDO</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="modal" id="checkoutModal">
    <div class="modal-card">
      <div class="cart-head"><h2>Finalizar pedido</h2><button id="closeCheckout">✕</button></div>
      <label>Nome completo<input id="name" placeholder="Seu nome"></label>
      <label>WhatsApp<input id="phone" placeholder="(00) 00000-0000" inputmode="tel"></label>
      <label>Endereço<input id="address" placeholder="Rua, número, bairro"></label>
      <label>Complemento<input id="complement" placeholder="Opcional"></label>
      <label>Forma de pagamento
        <select id="payment">
          <option>Pix</option><option>Dinheiro</option><option>Cartão na entrega</option>
        </select>
      </label>
      <label>Observação<textarea id="note" placeholder="Alguma observação?"></textarea></label>
      <p class="hint">Ao confirmar, o pedido será enviado para o WhatsApp da loja.</p>
      <button class="cta full" id="sendOrder">CONFIRMAR PEDIDO</button>
    </div>
  </div>

  <footer>
    <strong>SANHARO COXINHAS</strong>
    <span>Qualidade • Sabor • Atendimento</span>
  </footer>

<script src="app.js"></script>
</body>
</html>
